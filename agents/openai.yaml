interface:
  display_name: "EC-Brand Proposal"
  short_description: "研究驱动的中国市场品牌与 Campaign 提案共创"
  default_prompt: "使用 $ec-brand-proposal 与我共创中国市场的提案。先识别最终产出与当前入口：Brief 进入时先完成正常深度研究和不超过十个客户问题；客户答疑后补齐缺失研究，或在研究已充分时深化洞察；再用大胆假设、小心求证形成策略路线与明确推荐。每个下游模块都先给出 AI 推荐，只在真正改变核心方向、授权、逐页内容或视觉样页的节点暂停。用户否定策略、创意或执行方向并要求继续想时，只在聊天中探索，本地文件保持不动；明确收束并要求整理后才一次性更新。创意已经足够时补齐最小创意基础后直接进入物料，不需要的模块不要空建。圆桌完整发生在聊天中，让我随时参与。"
